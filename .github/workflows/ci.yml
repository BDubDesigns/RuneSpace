name: CI

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - labeled
  workflow_dispatch:
    inputs:
      ref:
        description: Ref or SHA to validate
        required: true
        type: string

concurrency:
  # Pull-request runs replace one another, but main and manual runs each keep a
  # distinct group. A non-full label (for example e2e-screenshots) starts a
  # cheap decision run without cancelling an in-flight full gate.
  group: >-
    ${{ github.event_name == 'pull_request'
      && format('ci-pr-{0}', github.event.pull_request.number)
      || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
      && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') }}

jobs:
  fast-checks:
    name: Install, typecheck, lint, test, build
    runs-on: ubuntu-latest
    env:
      CI_CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CI_CHECKOUT_REF }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Production build
        # The production build imports server/env.ts which validates DATABASE_URL
        # (and Better Auth requires BETTER_AUTH_SECRET). CI has no database and no
        # real auth secret, so syntactically valid placeholders are sufficient; no
        # real connection is made during `next build`. These are scoped to this step
        # only so that the earlier `pnpm install` keeps devDependencies
        # (NODE_ENV=production would skip them).
        env:
          DATABASE_URL: postgres://runespace:runespace@localhost:5432/runespace
          NODE_ENV: production
          # Insecure placeholder used ONLY for the CI build step. Real deployments
          # MUST set a strong BETTER_AUTH_SECRET; server/env.ts requires it at runtime.
          BETTER_AUTH_SECRET: "insecure-ci-build-only-secret-do-not-use-in-prod-0000000000"
          RUNESPACE_RELEASE_ID: ${{ env.CI_CHECKOUT_REF }}
        run: pnpm build

  gate-decision:
    name: Full gate decision
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.select.outputs.full }}
    env:
      CI_CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CI_CHECKOUT_REF }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select validation gate
        id: select
        run: node scripts/select-ci-gate.mjs

  integration:
    name: >-
      ${{ needs.gate-decision.outputs.full == 'true'
        && 'PostgreSQL integration tests'
        || 'Full gate not requested - PostgreSQL integration tests' }}
    if: ${{ needs.gate-decision.outputs.full == 'true' }}
    needs: gate-decision
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: runespace
          POSTGRES_PASSWORD: runespace
          POSTGRES_DB: runespace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runespace -d runespace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://runespace:runespace@localhost:5432/runespace
      CI_CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CI_CHECKOUT_REF }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm drizzle-kit migrate

      - name: PostgreSQL integration tests
        run: pnpm test:integration

  canonical-e2e:
    name: >-
      ${{ needs.gate-decision.outputs.full == 'true'
        && 'Canonical E2E browser journeys'
        || 'Full gate not requested - Canonical E2E browser journeys' }}
    if: ${{ needs.gate-decision.outputs.full == 'true' }}
    needs: gate-decision
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: runespace
          POSTGRES_PASSWORD: runespace
          POSTGRES_DB: runespace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U runespace -d runespace"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://runespace:runespace@localhost:5432/runespace
      # Opt-in frozen review screenshots. Off by default (the live PR preview is
      # the normal visual-review evidence); add the `e2e-screenshots` label to a
      # PR to capture and verify the curated screenshot package on the next run.
      # push-to-main has no PR/label context, so it stays off there too.
      RUNESPACE_E2E_SCREENSHOTS: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e-screenshots') }}
      CI_CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CI_CHECKOUT_REF }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:canonical
      # Frozen review package: only when explicitly requested, and then mandatory
      # (error if the runner did not produce it). Skipped entirely on a default
      # run, so a successful default run uploads nothing here.
      - name: Upload frozen review screenshots (opt-in)
        uses: actions/upload-artifact@v4
        if: success() && env.RUNESPACE_E2E_SCREENSHOTS == 'true'
        with:
          name: e2e-review-screenshots
          path: artifacts/e2e-review/
          if-no-files-found: error
      # Failure diagnostics: always retained on a failed run, bounded to Playwright
      # output (screenshots, traces, report) — never unrelated build output.
      - name: Upload failure diagnostics
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
