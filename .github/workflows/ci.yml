name: CI

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - labeled
  workflow_dispatch:
    inputs:
      ref:
        description: Ref or SHA to validate
        required: true
        type: string

concurrency:
  # Pull-request runs replace one another, but main and manual runs each keep a
  # distinct group. A non-full label (for example e2e-screenshots) does not
  # cancel an in-flight full gate; its queued run applies the current PR policy.
  group: >-
    ${{ github.event_name == 'pull_request'
      && format('ci-pr-{0}', github.event.pull_request.number)
      || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
      && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') }}

jobs:
  fast-checks:
    name: Install, typecheck, lint, test, build
    runs-on: ubuntu-latest
    env:
      CI_CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CI_CHECKOUT_REF }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Production build
        # The production build imports server/env.ts which validates DATABASE_URL
        # (and Better Auth requires BETTER_AUTH_SECRET). CI has no database and no
        # real auth secret, so syntactically valid placeholders are sufficient; no
        # real connection is made during `next build`. These are scoped to this step
        # only so that the earlier `pnpm install` keeps devDependencies
        # (NODE_ENV=production would skip them).
        env:
          DATABASE_URL: postgres://runespace:runespace@localhost:5432/runespace
          NODE_ENV: production
          # Insecure placeholder used ONLY for the CI build step. Real deployments
          # MUST set a strong BETTER_AUTH_SECRET; server/env.ts requires it at runtime.
          BETTER_AUTH_SECRET: "insecure-ci-build-only-secret-do-not-use-in-prod-0000000000"
          RUNESPACE_RELEASE_ID: ${{ env.CI_CHECKOUT_REF }}
        run: pnpm build

  gate-decision:
    name: Full gate decision
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.select.outputs.full }}
      merge_required: ${{ steps.select.outputs.merge_required }}
      screenshots: ${{ steps.select.outputs.screenshots }}
    env:
      CI_CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CI_CHECKOUT_REF }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select validation gate
        id: select
        run: node scripts/select-ci-gate.mjs

  integration:
    name: PostgreSQL integration tests
    if: ${{ needs.gate-decision.outputs.full == 'true' }}
    needs: gate-decision
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: runespace
          POSTGRES_PASSWORD: runespace
          POSTGRES_DB: runespace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runespace -d runespace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://runespace:runespace@localhost:5432/runespace
      CI_CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CI_CHECKOUT_REF }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: PostgreSQL integration tests
        run: pnpm test:integration

      - name: Issue #126 PostgreSQL maintenance integration tests
        run: pnpm test:integration:issue-126

  canonical-e2e:
    name: Canonical E2E shard ${{ matrix.shard }}/3
    if: ${{ needs.gate-decision.outputs.full == 'true' }}
    needs: gate-decision
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: runespace
          POSTGRES_PASSWORD: runespace
          POSTGRES_DB: runespace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U runespace -d runespace"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://runespace:runespace@localhost:5432/runespace
      RUNESPACE_E2E_SHARD_INDEX: ${{ matrix.shard }}
      RUNESPACE_E2E_SHARD_TOTAL: 3
      RUNESPACE_E2E_WORKERS: 2
      CI_CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CI_CHECKOUT_REF }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:canonical
      - name: Upload canonical timing
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-timing-shard-${{ matrix.shard }}
          path: .playwright/canonical-timing-*.json
          include-hidden-files: true
          if-no-files-found: ignore
      # Failure diagnostics: always retained on a failed run, bounded to Playwright
      # output (screenshots, traces, report) — never unrelated build output.
      - name: Upload failure diagnostics
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-diagnostics-shard-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
            .playwright/canonical-timing-*.json
          if-no-files-found: ignore

  canonical-screenshots:
    name: Canonical E2E review screenshots
    if: ${{ needs.gate-decision.outputs.screenshots == 'true' }}
    needs: gate-decision
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: runespace
          POSTGRES_PASSWORD: runespace
          POSTGRES_DB: runespace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U runespace -d runespace"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://runespace:runespace@localhost:5432/runespace
      RUNESPACE_E2E_SCREENSHOTS: "true"
      RUNESPACE_E2E_WORKERS: 1
      CI_CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CI_CHECKOUT_REF }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:canonical
      - name: Upload frozen review screenshots
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: e2e-review-screenshots
          path: artifacts/e2e-review/
          if-no-files-found: error
      - name: Upload screenshot failure diagnostics
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshot-failure-diagnostics
          path: |
            test-results/
            playwright-report/
            .playwright/canonical-timing-*.json
          if-no-files-found: ignore

  full-gate:
    name: Full gate
    if: ${{ always() }}
    needs: [gate-decision, integration, canonical-e2e, canonical-screenshots]
    runs-on: ubuntu-latest
    steps:
      - name: Verify full validation result
        env:
          DECISION_RESULT: ${{ needs.gate-decision.result }}
          FULL: ${{ needs.gate-decision.outputs.full }}
          SCREENSHOTS_REQUIRED: ${{ needs.gate-decision.outputs.screenshots }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          E2E_RESULT: ${{ needs.canonical-e2e.result }}
          SCREENSHOTS_RESULT: ${{ needs.canonical-screenshots.result }}
        run: |
          set -euo pipefail
          if [[ "$DECISION_RESULT" != "success" ]]; then
            echo "Full gate decision failed."
            exit 1
          fi
          if [[ "$FULL" != "true" ]]; then
            echo "Full gate not requested for this draft checkpoint."
            exit 0
          fi
          if [[ "$INTEGRATION_RESULT" != "success" || "$E2E_RESULT" != "success" ]]; then
            echo "Full validation requires successful integration and all canonical E2E shards."
            exit 1
          fi
          if [[ "$SCREENSHOTS_REQUIRED" == "true" && "$SCREENSHOTS_RESULT" != "success" ]]; then
            echo "The requested screenshot lane did not pass."
            exit 1
          fi
          echo "Full validation passed."

  merge-gate:
    name: Merge gate
    if: ${{ always() }}
    needs: [gate-decision, integration, canonical-e2e, canonical-screenshots, full-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce merge validation
        env:
          DECISION_RESULT: ${{ needs.gate-decision.result }}
          FULL: ${{ needs.gate-decision.outputs.full }}
          MERGE_REQUIRED: ${{ needs.gate-decision.outputs.merge_required }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          E2E_RESULT: ${{ needs.canonical-e2e.result }}
          SCREENSHOTS_REQUIRED: ${{ needs.gate-decision.outputs.screenshots }}
          SCREENSHOTS_RESULT: ${{ needs.canonical-screenshots.result }}
          FULL_GATE_RESULT: ${{ needs.full-gate.result }}
        run: |
          set -euo pipefail
          if [[ "$DECISION_RESULT" != "success" ]]; then
            echo "Gate decision failed."
            exit 1
          fi
          if [[ "$MERGE_REQUIRED" != "true" ]]; then
            echo "Draft checkpoint: merge validation is intentionally unsatisfied."
            exit 1
          fi
          if [[ "$FULL" != "true" ||
                "$INTEGRATION_RESULT" != "success" ||
                "$E2E_RESULT" != "success" ||
                ("$SCREENSHOTS_REQUIRED" == "true" && "$SCREENSHOTS_RESULT" != "success") ||
                "$FULL_GATE_RESULT" != "success" ]]; then
            echo "Merge validation requires successful integration and canonical E2E."
            exit 1
          fi
          echo "Merge validation passed."
