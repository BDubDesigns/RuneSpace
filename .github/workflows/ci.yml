name: CI

# Every PR revision, Draft or not, runs the full validation. Each major lane has
# its own checkout, runner, and database, so all of them start together rather
# than waiting for the fast job; `Merge gate` then requires every one of them.
on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      # Adding `e2e-screenshots` must start a run that includes that lane. Any
      # label event reruns the whole validation for the same head, so a run that
      # skipped everything can never leave a passing `Merge gate` behind.
      - labeled
  workflow_dispatch:
    inputs:
      ref:
        description: Ref or SHA to validate
        required: true
        type: string

concurrency:
  # A newer run for the same PR replaces the older one. Main and manual runs
  # each keep a unique group, so PR activity never cancels them.
  group: >-
    ${{ github.event_name == 'pull_request'
      && format('ci-pr-{0}', github.event.pull_request.number)
      || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast-checks:
    name: Install, typecheck, lint, test, build
    runs-on: ubuntu-latest
    env:
      CI_CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CI_CHECKOUT_REF }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck (app and all tests, including tests/e2e)
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Production build
        # The production build imports server/env.ts which validates DATABASE_URL
        # (and Better Auth requires BETTER_AUTH_SECRET). CI has no database and no
        # real auth secret, so syntactically valid placeholders are sufficient; no
        # real connection is made during `next build`. These are scoped to this step
        # only so that the earlier `pnpm install` keeps devDependencies
        # (NODE_ENV=production would skip them).
        env:
          DATABASE_URL: postgres://runespace:runespace@localhost:5432/runespace
          NODE_ENV: production
          # Insecure placeholder used ONLY for the CI build step. Real deployments
          # MUST set a strong BETTER_AUTH_SECRET; server/env.ts requires it at runtime.
          BETTER_AUTH_SECRET: "insecure-ci-build-only-secret-do-not-use-in-prod-0000000000"
          RUNESPACE_RELEASE_ID: ${{ env.CI_CHECKOUT_REF }}
        run: pnpm build

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: runespace
          POSTGRES_PASSWORD: runespace
          POSTGRES_DB: runespace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runespace -d runespace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://runespace:runespace@localhost:5432/runespace
      CI_CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CI_CHECKOUT_REF }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: PostgreSQL integration tests
        run: pnpm test:integration

      - name: Issue #126 PostgreSQL maintenance integration tests
        run: pnpm test:integration:issue-126

  canonical-e2e:
    name: Canonical E2E shard ${{ matrix.shard }}/5
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: runespace
          POSTGRES_PASSWORD: runespace
          POSTGRES_DB: runespace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U runespace -d runespace"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://runespace:runespace@localhost:5432/runespace
      RUNESPACE_E2E_SHARD_INDEX: ${{ matrix.shard }}
      RUNESPACE_E2E_SHARD_TOTAL: 5
      RUNESPACE_E2E_WORKERS: 2
      CI_CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CI_CHECKOUT_REF }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:canonical
      - name: Upload canonical timing
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-timing-shard-${{ matrix.shard }}
          path: .playwright/canonical-timing-*.json
          include-hidden-files: true
          if-no-files-found: ignore
      # Failure diagnostics: always retained on a failed run, bounded to Playwright
      # output (screenshots, traces, report) — never unrelated build output.
      - name: Upload failure diagnostics
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-diagnostics-shard-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
            .playwright/canonical-timing-*.json
          if-no-files-found: ignore

  canonical-screenshots:
    name: Canonical E2E review screenshots
    # Opt-in only: the owner requests frozen review screenshots with the
    # `e2e-screenshots` label. Main pushes and manual runs never request it.
    if: ${{ contains(github.event.pull_request.labels.*.name, 'e2e-screenshots') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: runespace
          POSTGRES_PASSWORD: runespace
          POSTGRES_DB: runespace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U runespace -d runespace"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://runespace:runespace@localhost:5432/runespace
      RUNESPACE_E2E_SCREENSHOTS: "true"
      RUNESPACE_E2E_WORKERS: 1
      CI_CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CI_CHECKOUT_REF }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:canonical
      - name: Upload frozen review screenshots
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: e2e-review-screenshots
          path: artifacts/e2e-review/
          if-no-files-found: error
      - name: Upload screenshot failure diagnostics
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshot-failure-diagnostics
          path: |
            test-results/
            playwright-report/
            .playwright/canonical-timing-*.json
          if-no-files-found: ignore

  merge-gate:
    name: Merge gate
    # always(): the gate must run and fail when a lane failed, was skipped, or
    # was canceled. A gate that is itself skipped reads as passing on GitHub.
    if: ${{ always() }}
    needs: [fast-checks, integration, canonical-e2e, canonical-screenshots]
    runs-on: ubuntu-latest
    env:
      CI_CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CI_CHECKOUT_REF }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require every validation lane
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-merge-gate.mjs
